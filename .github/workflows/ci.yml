name: CI
# Stub with the same required check names as osborn-studio/osstack CI (ADR-006 main-quality).
# A PROBE_FAIL file in the tree makes every check fail (probe P-11).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -e PROBE_FAIL
  graph-macos-fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - run: test ! -e PROBE_FAIL
  graph-runtime-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.6.0', '22.23.1']
    steps:
      - uses: actions/checkout@v4
      - run: test ! -e PROBE_FAIL
